name: Verify release

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/verify_release.py
      - run: python -m compileall -q scripts
      - name: Install the released tool wheel
        run: python -m pip install releases/*/saycut_tools-*.whl
      - run: python scripts/verify_mcp.py
